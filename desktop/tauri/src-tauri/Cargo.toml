[package]
name = "knowledge-agent"
version = "0.1.0"
description = "Knowledge Agent desktop shell"
authors = ["Tushar"]
edition = "2021"
rust-version = "1.77"

[lib]
# backend.rs is plain std (no Tauri) so it can be unit-tested on its own.
name = "knowledge_agent_lib"
path = "src/lib.rs"

[[bin]]
name = "knowledge-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
